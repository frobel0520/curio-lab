name: Publish verified static site
on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'package*.json', 'next.config.*', 'wrangler.site.jsonc', 'scripts/publish-site-ci.mjs', '.github/workflows/publish-site.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: curio-site-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - name: Require owner and main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Check existing publication bindings
        id: bindings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"; then echo ready=true >> "$GITHUB_OUTPUT"; else echo ready=false >> "$GITHUB_OUTPUT"; fi
      - if: steps.bindings.outputs.ready == 'true'
        run: npm ci
      - if: steps.bindings.outputs.ready == 'true'
        run: npm run lint && npm run typecheck && npm run worker:typecheck && npm test && npm run build
      - name: Publish using only this repository's existing bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-site-ci.mjs
      - name: Read actual published headers separately from publication status
        run: node scripts/published-header-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: site-publication-${{ github.run_id }}
          path: |
            artifacts/site-publication/report.json
            artifacts/published-headers/report.json
          retention-days: 14
          if-no-files-found: warn
